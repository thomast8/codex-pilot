[project]
name = "codex-ci-helper"
version = "0.1.0"
description = "Deliver GitHub review and CI events into existing Codex Desktop tasks"
requires-python = ">=3.11"
dependencies = ["codex-desktop-core"]

[project.scripts]
codex-ci = "codex_ci.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_ci"]

[tool.uv.sources]
codex-desktop-core = { path = "../../core" }

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/codex_ci"]
