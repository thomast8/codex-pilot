[project]
name = "codex-pilot"
version = "0.3.0"
description = "Drive Codex Desktop threads from Claude Code over the app's local IPC socket"
requires-python = ">=3.11"
dependencies = ["mcp>=2.1"]

[project.scripts]
codex-pilot-mcp = "codex_pilot.mcp_server:main"
codex-pilot = "codex_pilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "anyio>=4.14.2",
    "pytest-anyio>=0.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_pilot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/codex_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
